<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros 5 Meses</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0c0c;
            --bg-deep: #050606;
            --paper: #141616;
            --text-dark: #f1eee7;
            --text-light: #aaa69d;
            --accent: #c8ad72;
            --white-border: rgba(255,255,255,0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-main); color: var(--text-dark); line-height: 1.7; overflow-x: hidden; }
        body.locked { overflow: hidden; height: 100vh; }

        /* PANTALLA INICIAL */
        #welcome-screen { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity 1s; }
        .welcome-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 15px 45px; border-radius: 50px; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; }

        /* NAVBAR */
        .music-navbar { position: sticky; top: 0; z-index: 5000; height: 75px; background: rgba(12,14,14,0.98); border-bottom: 1px solid var(--white-border); display: flex; align-items: center; justify-content: center; }
        .navbar-inner { width: min(850px, 92%); display: flex; align-items: center; gap: 20px; }
        .nav-btn { background: none; color: var(--accent); border: 1px solid var(--accent); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        
        .lyrics-window { flex: 1; height: 55px; position: relative; overflow: hidden; }
        .lyrics-track { position: absolute; width: 100%; transition: transform 0.5s ease; }
        .lyric-line { height: 55px; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-style: italic; color: #555; opacity: 0.5; transition: all 0.5s; }
        .lyric-line.active { color: var(--accent); opacity: 1; transform: scale(1.1); }

        /* Estilos generales mantenidos de tu versión anterior */
        header { text-align: center; padding: 60px 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 20px; }
        section { width: min(800px, 90%); margin: 0 auto 50px; padding: 35px 0; }
        .section-title { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 2rem; margin-bottom: 15px; }
        .section-text { color: var(--text-light); }
        .counter-box { text-align: center; padding: 30px; background: var(--paper); border-radius: 15px; }
        .counter-numbers { color: var(--accent); font-size: 2rem; font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="locked">

    <div id="welcome-screen">
        <button class="welcome-btn" onclick="startExperience()">Entrar</button>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="./cancion.mp3" type="audio/mpeg">
    </audio>

    <nav class="music-navbar">
        <div class="navbar-inner">
            <button id="music-toggle" class="nav-btn" onclick="toggleMusic()">▶️</button>
            <div class="lyrics-window">
                <div id="lyrics-track" class="lyrics-track"></div>
            </div>
        </div>
    </nav>

    <header>
        <h1>Cinco meses con vos</h1>
        <p>Cinco meses desde aquel 11 de marzo...</p>
    </header>

    <section>
        <div class="counter-box">
            <div id="counter-display" class="counter-numbers">Cargando...</div>
        </div>
    </section>

    <script>
        const bgMusic = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-toggle");
        
        function startExperience() {
            document.getElementById("welcome-screen").style.opacity = "0";
            setTimeout(() => document.getElementById("welcome-screen").style.display = "none", 1000);
            document.body.classList.remove("locked");
            
            bgMusic.play().then(() => {
                musicBtn.innerText = "⏸️";
            });
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.innerText = "⏸️";
            } else {
                bgMusic.pause();
                musicBtn.innerText = "▶️";
            }
        }

        const lyrics = [
            { time: 0, text: "Los sabios dicen que solo los tontos se apresuran" },
            { time: 8, text: "Pero no puedo evitar enamorarme de ti" },
            { time: 17, text: "¿Debería quedarme? ¿Sería un pecado?" },
            { time: 26, text: "Si no puedo evitar enamorarme de ti" },
            { time: 35, text: "Como un río que fluye seguro hacia el mar" },
            { time: 44, text: "Querida, así es, algunas cosas están destinadas a suceder" },
            { time: 53, text: "Toma mi mano, toma mi vida entera también" },
            { time: 62, text: "Porque no puedo evitar enamorarme de ti" },
            { time: 71, text: "Como un río que fluye seguro hacia el mar" },
            { time: 80, text: "Querida, así es, algunas cosas están destinadas a suceder" },
            { time: 89, text: "Toma mi mano, toma mi vida entera también" },
            { time: 97, text: "Porque no puedo evitar enamorarme de ti" },
            { time: 106, text: "Porque no puedo evitar enamorarme de ti" }
        ];

        const lyricsTrack = document.getElementById("lyrics-track");
        lyrics.forEach((line, index) => {
            const div = document.createElement("div");
            div.className = "lyric-line";
            div.textContent = line.text;
            lyricsTrack.appendChild(div);
        });

        function updateLyrics() {
            const time = bgMusic.currentTime;
            let index = 0;
            for(let i=0; i<lyrics.length; i++) { if(time >= lyrics[i].time) index = i; }
            
            document.querySelectorAll(".lyric-line").forEach((el, i) => {
                el.classList.toggle("active", i === index);
            });
            lyricsTrack.style.transform = `translateY(${-index * 55}px)`;
            requestAnimationFrame(updateLyrics);
        }
        updateLyrics();

        function actualizarContador() {
            const diff = new Date() - new Date(2026, 2, 11, 17, 0, 0);
            const d = Math.floor(diff/86400000);
            const h = Math.floor((diff%86400000)/3600000);
            document.getElementById("counter-display").textContent = `${d} días, ${h} horas`;
        }
        setInterval(actualizarContador, 1000);
    </script>
</body>
</html>
